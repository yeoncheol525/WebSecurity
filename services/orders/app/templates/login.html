{% extends "base.html" %}
{% block title %}로그인 · MiniShop{% endblock %}
{% block content %}
<section class="container login-layout">
  <div class="login-intro"><span class="eyebrow">WELCOME BACK</span><h1>반가워요.<br>다시 만나서<span>!</span></h1><p>로그인하고 나의 주문 내역을<br>편하게 확인하세요.</p><div class="login-ornament" aria-hidden="true"><span>m.</span><i></i><b>✳</b></div></div>
  <div class="login-panel"><div class="panel-heading"><span class="eyebrow">YOUR ACCOUNT</span><h2>로그인</h2></div>
    <form class="login-form" id="login-form"><div class="form-field"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" placeholder="아이디를 입력하세요" required maxlength="64" autofocus></div><div class="form-field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required maxlength="256"></div><button class="button button-primary button-full" type="submit">로그인 <span aria-hidden="true">→</span></button></form>
    <p class="login-note">팀에서 안내받은 계정으로 로그인하세요.</p>
  </div>
</section>
{% endblock %}
