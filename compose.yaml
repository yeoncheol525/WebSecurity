name: team4-websecurity

services:
  web:
    build: .
    image: team4-minishop:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5000}:5000"
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
