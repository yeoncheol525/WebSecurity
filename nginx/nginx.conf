worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    default_type application/json;
    server_tokens off;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format audit escape=json '{"timestamp":"$time_iso8601","request_id":"$request_id","service":"nginx","status":$status,"duration_s":$request_time}';
    access_log /dev/stdout audit;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8080;
        set $catalog catalog-service:8000;
        set $orders order-service:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'" always;
        location = / { proxy_pass http://$orders; }
        location = /shop { proxy_pass http://$orders; }
        location = /health { proxy_pass http://$catalog/health; }
        location = /health/catalog { proxy_pass http://$catalog/health; }
        location = /health/orders { proxy_pass http://$orders/health; }
        location ~ ^/products(/|$) { proxy_pass http://$catalog; }
        location ~ ^/(login|logout|orders|session|account|static)(/|$) { proxy_pass http://$orders; }
        location / { return 404 '{"error":"not_found"}'; }
    }
}
